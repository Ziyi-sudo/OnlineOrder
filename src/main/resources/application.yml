spring:
  jackson:
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:postgresql://${DATABASE_URL:localhost}:${DATABASE_PORT:5432}/onlineorder
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: ${INIT_DB:always}
      schema-locations: "classpath:database-init.sql"
  cache:
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=60s,recordStats

logging:
  level:
    org.apache.coyote.http11.Http11InputBuffer: ${HTTP_LOG_LEVEL:WARN}
    org.springframework.jdbc.datasource.init: ${SQL_INIT_LOG_LEVEL:WARN}
    org.springframework.jdbc.core: ${SQL_LOG_LEVEL:WARN}